
name: document-classification

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: classifier_db
      POSTGRES_USER: docuser
      POSTGRES_PASSWORD: docpass
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docuser -d classifier_db"]
      interval: 5s
      timeout: 3s
      retries: 15

  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?Set RUSTFS_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY in .env}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    command: ["/data"]
    ports:
      - "127.0.0.1:9200:9000"
      - "127.0.0.1:9201:9001"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    environment:
      POSTGRES_DSN: postgresql://docuser:docpass@postgres:5432/classifier_db

      S3_ENDPOINT_URL: http://rustfs:9000
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9200}
      S3_BUCKET: classified-documents

      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY}
      AWS_REGION: us-east-1

      ENABLE_OCR: "true"
      OCR_LANGS: rus+eng
      OCR_MIN_TEXT_CHARS: "30"
      MAX_UPLOAD_MB: "20"
      CLASSIFICATION_THRESHOLD: "0.70"
    ports:
      - "8082:8080"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./artifacts:/app/artifacts

  ui:
    build: .
    restart: unless-stopped
    command:
      - streamlit
      - run
      - ui/streamlit_app.py
      - --server.port=8501
      - --server.address=0.0.0.0
      - --server.headless=true
    environment:
      API_BASE_URL: http://api:8080
    depends_on:
      - api
    ports:
      - "8512:8501"

volumes:
  postgres_data:
  rustfs_data:
